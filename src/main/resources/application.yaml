spring:
  application:
    name: dlp-analyzer
  datasource:
    url: jdbc:postgresql://localhost:5555/dlqanalyzer
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: dlq-analyzer
      auto-offset-reset: earliest
      enable-auto-commit: false

  data:
    redis:
      host: localhost
      port: 6379

dlq:
  polling:
    interval-ms: 30000
  rabbitmq:
    dlq-patterns: .dlq,-dlq,.dead-letter
  kafka:
    dlt-suffix: .DLT
  replay:
    default-rate-per-minute: 100